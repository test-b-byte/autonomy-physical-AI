[package]
name = "ghost-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ghost"
path = "src/main.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
axum        = { version = "0.7", features = ["ws"] }
tower-http  = { version = "0.5", features = ["cors"] }
log         = "0.4"
env_logger  = "0.11"

# Nav2 parameters for the GHOST mecanum base (holonomic, ~0.25 × 0.2 m).
#
# No global map: both costmaps are rolling windows in the odom frame, fed by
# the depth camera's point cloud.  GHOST picks goals; Nav2 only has to get
# there without hitting anything.  Speeds are deliberately low — raise
# vx_max / vy_max / wz_max once the base is tuned.
#
# Recent Nav2 publishes TwistStamped on /cmd_vel (enable_stamped_cmd_vel).
# On Humble that parameter doesn't exist: run base_driver.py --unstamped.

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /visual_slam/tracking/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 15.0
    enable_stamped_cmd_vel: true
    odom_topic: /visual_slam/tracking/odometry
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 6.28        # any heading — GHOST only cares where the robot is
      stateful: true
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.067
      batch_size: 1000
      iteration_count: 1
      motion_model: "Omni"           # mecanum: can strafe
      vx_max: 0.30
      vx_min: -0.20
      vy_max: 0.25
      wz_max: 1.2
      ax_max: 0.6
      ax_min: -0.6
      ay_max: 0.6
      az_max: 2.0
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      temperature: 0.3
      gamma: 0.015
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic",
                "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      CostCritic:
        cost_weight: 3.81
        critical_cost: 300.0
        collision_cost: 1000000.0
        near_goal_distance: 0.5
      PathAngleCritic:
        mode: 2                       # holonomic: don't force facing along the path

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: true             # rolling window: most of the world is unknown

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: true
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.18
      transform_tolerance: 0.3
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.8
        mark_threshold: 0
        observation_sources: depth
        depth:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          sensor_frame: ""
          min_obstacle_height: 0.06     # ignore the floor
          max_obstacle_height: 0.8
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          marking: true
          clearing: true
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true            # no static map
      width: 20
      height: 20
      resolution: 0.05
      robot_radius: 0.18
      track_unknown_space: true
      transform_tolerance: 0.3
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.8
        mark_threshold: 0
        observation_sources: depth
        depth:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          sensor_frame: ""
          min_obstacle_height: 0.06     # ignore the floor
          max_obstacle_height: 0.8
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          marking: true
          clearing: true
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
